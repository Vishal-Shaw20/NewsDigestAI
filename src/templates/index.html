<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsDigest AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="/static/style.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend:{
                    fontFamily:{
                        sans: ['Inter','sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-200 dark:bg-gray-900 font-sans antialiased flex flex-col min-h-screen transition-colors duration-300">

    <!-- === SECTION 1: HEADER === -->
    <header class="bg-gradient-to-r from-white via-blue-50 to-white dark:from-gray-800 dark:via-gray-800 dark:to-gray-800 shadow-sm">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div>
                <h1 class="font-bold text-3xl text-gray-800 dark:text-white">NewsDigest AI</h1>
                <p class="text-gray-600 dark:text-gray-400">Your Real-Time News Summarizer</p>
            </div>
            <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" aria-label="Toggle dark mode">
                <svg id="sun-icon" class="w-6 h-6 text-yellow-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg id="moon-icon" class="w-6 h-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </nav>
    </header>

    <!-- === SECTION 2: CONTROLS === -->
    <main class="container mx-auto px-6 pt-6 pb-12 flex-grow">
        <!-- Hero Section -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-800 dark:text-white mb-2 drop-shadow-sm">
                Real-Time AI News Summaries
            </h1>
            <p class="text-lg text-gray-600 dark:text-gray-400 max-w-2xl mx-auto">
                Search any topic — get fresh articles + concise AI summaries in seconds.
            </p>
        </div>

        <!-- Quick Topic Buttons -->
        <div class="flex flex-wrap justify-center gap-2 mb-6" id="quick-topics">
            <button data-topic="Technology" class="px-4 py-1.5 rounded-full text-sm font-medium bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-800 transition-colors">Technology</button>
            <button data-topic="Sports" class="px-4 py-1.5 rounded-full text-sm font-medium bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300 hover:bg-green-200 dark:hover:bg-green-800 transition-colors">Sports</button>
            <button data-topic="Business" class="px-4 py-1.5 rounded-full text-sm font-medium bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-300 hover:bg-purple-200 dark:hover:bg-purple-800 transition-colors">Business</button>
            <button data-topic="Health" class="px-4 py-1.5 rounded-full text-sm font-medium bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300 hover:bg-red-200 dark:hover:bg-red-800 transition-colors">Health</button>
            <button data-topic="Science" class="px-4 py-1.5 rounded-full text-sm font-medium bg-yellow-100 text-yellow-700 dark:bg-yellow-900 dark:text-yellow-300 hover:bg-yellow-200 dark:hover:bg-yellow-800 transition-colors">Science</button>
            <button data-topic="Entertainment" class="px-4 py-1.5 rounded-full text-sm font-medium bg-pink-100 text-pink-700 dark:bg-pink-900 dark:text-pink-300 hover:bg-pink-200 dark:hover:bg-pink-800 transition-colors">Entertainment</button>
        </div>

        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md mb-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">

                <!-- Topic Input -->
                <div>
                    <label for="topic-input" class=" pl-1 block text-sm font-medium text-gray-600 dark:text-gray-400">Topic</label>
                    <input type="text" id="topic-input" placeholder="Technology" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl px-4 py-2 shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-gray-900 dark:text-white placeholder-gray-400">
                </div>

                <!-- Language Selector -->
                <div>
                    <label for="language-select" class="pl-1 block text-sm font-medium text-gray-600 dark:text-gray-400">Language</label>
                    <select id="language-select" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl px-4 py-2 shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-gray-900 dark:text-white">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="pt">Portuguese</option>
                        <option value="ar">Arabic</option>
                        <option value="zh">Chinese</option>
                        <option value="ja">Japanese</option>
                    </select>
                </div>

                <!-- Max Results Input -->
                <div>
                    <label for="max-results-input" class="pl-1 block text-sm font-medium text-gray-600 dark:text-gray-400">Results</label>
                    <input type="number" id="max-results-input" placeholder="10" min="1" max="10" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl px-4 py-2 shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-gray-900 dark:text-white placeholder-gray-400">
                </div>

                <!-- The Button -->
                <div>
                    <button id="fetch-button" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg hover:scale-[1.02] hover:shadow-xl active:scale-[0.98] transition flex items-center justify-center gap-2">
                        <!-- Search Icon SVG -->
                        <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="white">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                        </svg>
                        Fetch & Summarize
                    </button>
                </div>
            </div>
        </div>

        <!-- === SECTION 3: STATUS AREA === -->
        <div id="status-container" class="text-center my-8" style="min-height: 40px;">
            <!-- The Error Message (hidden by default) -->
            <div id="error-message" class="hidden bg-red-100 dark:bg-red-900/30 border border-red-400 dark:border-red-800 text-red-700 dark:text-red-400 px-4 py-3 rounded-md">
                <!--Error Message-->
            </div>
        </div>

        <div id="skeleton-loader-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-[1200px] mx-auto hidden">
            <!-- Repeat skeleton cards -->
            <div class="animate-pulse bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
                <div class="h-6 bg-gray-300 dark:bg-gray-700 rounded w-3/4 mb-3"></div>
                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-1/2 mb-2"></div>
                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-full mb-2"></div>
                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-5/6"></div>
                <div class="h-48 bg-gray-300 dark:bg-gray-700 rounded mt-4"></div>
            </div>
            <div class="animate-pulse bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
                <div class="h-6 bg-gray-300 dark:bg-gray-700 rounded w-3/4 mb-3"></div>
                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-1/2 mb-2"></div>
                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-full mb-2"></div>
                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-5/6"></div>
                <div class="h-48 bg-gray-300 dark:bg-gray-700 rounded mt-4"></div>
            </div>
            <div class="animate-pulse bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
                <div class="h-6 bg-gray-300 dark:bg-gray-700 rounded w-3/4 mb-3"></div>
                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-1/2 mb-2"></div>
                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-full mb-2"></div>
                <div class="h-4 bg-gray-300 dark:bg-gray-700 rounded w-5/6"></div>
                <div class="h-48 bg-gray-300 dark:bg-gray-700 rounded mt-4"></div>
            </div>
        </div>

        <!-- === SECTION 4: ARTICLE LIST === -->
        <div id="article-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-[1200px] mx-auto">
            <!-- Article cards will be dynamically inserted here by JavaScript -->
        </div>
    </main>

    <!-- === SECTION 5: FOOTER === -->
    <footer class="bg-gray-800 dark:bg-gray-950 text-gray-400 py-8 mt-20">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm tracking-wide">&copy; 2025 <span class="font-semibold text-white">NewsDigest AI</span> • Built by Vishal Shaw</p>
        </div>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
